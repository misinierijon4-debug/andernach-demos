<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sinnesorgan Auge</title>
<style>
  html, body { margin: 0; background: #F7F5F0; overflow: hidden; }
  svg { display: block; font-family: 'Inter', sans-serif; }
  text { fill: #1E2430; }
  .tag { font-size: 20px; font-weight: 700; letter-spacing: 3px; fill: #2F6FDE; }
  .title { font-size: 50px; font-weight: 700; }
  .lbl { font-size: 24px; font-weight: 600; }
  .sm { font-size: 20px; fill: #6B7280; }
  .muted { fill: #8A94A3; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F2A900"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FDE"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5283E"/>
    </marker>
  </defs>
</svg>
<script src="script.js"></script>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const TIMING = VIDEO_SCRIPT.computeTiming();
const SC = Object.fromEntries(TIMING.scenes.map(s => [s.id, s]));

const C = {
  ink: '#1E2430', grey: '#6B7280', line: '#D8D2C6', accent: '#2F6FDE',
  light: '#F2A900', na: '#E9B949', cgmp: '#D8435A', rh: '#B5283E',
  retina: '#F0A982', choroid: '#B5654F', sclera: '#D9D3C7', nerve: '#F3DDB0',
  card: '#FFFFFF',
};

// ---------- helpers ----------
function E(tag, attrs = {}, parent = stage, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const G = (parent, attrs = {}) => E('g', attrs, parent);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ramp = (t, t0, d) => ease(clamp((t - t0) / d));
const lerp = (a, b, x) => a + (b - a) * x;

// "eye:2+0.5" -> Startzeit von Satz 2 der Szene "eye" plus 0,5 s
function cue(spec) {
  if (typeof spec === 'number') return spec;
  const m = /^(\w+):(\w+)([+-][\d.]+)?$/.exec(spec);
  const s = SC[m[1]];
  let t;
  const off = m[3] ? parseFloat(m[3]) : 0;
  if (m[2] === 'start') t = s.start;
  else if (m[2] === 'end') t = s.end;
  else {
    const l = s.lines[+m[2]];
    t = l.start;
    if (off > l.end - l.start + 0.7) console.warn('Cue nach Satzende: ' + spec + ' (Satzdauer ' + (l.end - l.start).toFixed(1) + ' s)');
  }
  return t + off;
}

// Keyframes [[cue, wert], ...] mit weicher Interpolation
function kf(t, frames) {
  const f = frames.map(([c, v]) => [cue(c), v]);
  if (t <= f[0][0]) return f[0][1];
  for (let i = 1; i < f.length; i++) {
    if (t <= f[i][0]) return lerp(f[i - 1][1], f[i][1], ease((t - f[i - 1][0]) / (f[i][0] - f[i - 1][0])));
  }
  return f[f.length - 1][1];
}

const anims = [];
const updaters = [];
// Ein-/Ausblenden eines Elements an Satz-Zeitpunkten
function show(el, tin, tout, opt = {}) {
  anims.push({ el, tin: cue(tin), tout: tout == null ? null : cue(tout), din: opt.din ?? 0.6, dout: opt.dout ?? 0.5, rise: opt.rise ?? 0, draw: opt.draw ?? 0, max: opt.max ?? 1 });
  return el;
}
// Pfad "zeichnen" (stroke-dashoffset)
function drawPath(el, tin, dur, tout) {
  const len = el.getTotalLength();
  el.setAttribute('stroke-dasharray', len);
  el.setAttribute('stroke-dashoffset', len);
  anims.push({ el, tin: cue(tin), tout: tout == null ? null : cue(tout), din: 0.01, dout: 0.5, rise: 0, draw: dur, len, max: 1 });
  return el;
}

function header(parent, tag, title) {
  E('text', { x: 120, y: 112, class: 'tag' }, parent, tag);
  E('text', { x: 120, y: 170, class: 'title' }, parent, title);
}

// Beschriftung mit Führungslinie
function label(parent, text, tx, ty, px, py, anchor = 'start', cls = 'lbl') {
  const g = G(parent);
  let lx;
  if (anchor === 'end') lx = [tx + 12, ty - 8];
  else if (anchor === 'start') lx = [tx - 12, ty - 8];
  else lx = [tx, ty < py ? ty + 10 : ty - 30];
  E('line', { x1: lx[0], y1: lx[1], x2: px, y2: py, stroke: '#9AA3AF', 'stroke-width': 2 }, g);
  E('circle', { cx: px, cy: py, r: 5, fill: C.ink }, g);
  E('text', { x: tx, y: ty, 'text-anchor': anchor, class: cls }, g, text);
  return g;
}

function textWidth(str, size, weight = 600) {
  const t = E('text', { x: -9999, y: -9999, 'font-size': size, 'font-weight': weight }, stage, str);
  const w = t.getComputedTextLength();
  t.remove();
  return w;
}

// Abgerundete Box mit zentriertem Text
function pill(parent, cx, cy, str, opt = {}) {
  const size = opt.size ?? 26, padX = opt.padX ?? 26, h = opt.h ?? 60;
  const w = opt.w ?? textWidth(str, size, opt.weight ?? 600) + padX * 2;
  const g = G(parent);
  E('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: opt.rx ?? h / 2, fill: opt.fill ?? C.card, stroke: opt.stroke ?? C.line, 'stroke-width': 2 }, g);
  E('text', { x: cx, y: cy + size * 0.36, 'text-anchor': 'middle', 'font-size': size, 'font-weight': opt.weight ?? 600, fill: opt.color ?? C.ink }, g, str);
  g.w = w;
  return g;
}

function arcPath(cx, cy, r, a1, a2) {
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2);
  return `M${x1},${y1} A${r},${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2},${y2}`;
}

// ---------- Szenen ----------
function buildIntro() {
  const g = show(G(stage), 'intro:start', 'eye:start');
  // stilisiertes Auge
  const icon = G(g);
  drawPath(E('path', { d: 'M820,370 Q960,250 1100,370 Q960,490 820,370 Z', fill: 'none', stroke: C.ink, 'stroke-width': 6, 'stroke-linejoin': 'round' }, icon), 'intro:start+0.2', 1.4);
  show(E('circle', { cx: 960, cy: 370, r: 52, fill: C.accent }, icon), 'intro:start+1.0');
  show(E('circle', { cx: 960, cy: 370, r: 22, fill: C.ink }, icon), 'intro:start+1.2');
  show(E('circle', { cx: 975, cy: 355, r: 8, fill: '#fff' }, icon), 'intro:start+1.3');
  show(E('text', { x: 960, y: 580, 'text-anchor': 'middle', 'font-size': 96, 'font-weight': 800 }, g, 'Sinnesorgan Auge'), 'intro:start+0.6', null, { rise: 14 });
  show(E('text', { x: 960, y: 640, 'text-anchor': 'middle', 'font-size': 30, class: 'muted' }, g, 'Erklärvideo · Biologie'), 'intro:start+1.0', null, { rise: 10 });
  show(pill(g, 960, 740, '> 50 % aller Sinnesrezeptoren sitzen in den Augen', { fill: '#EAF1FD', stroke: '#C5D7F7', size: 28 }), 'intro:1+0.5');
  const chips = G(g);
  const c1 = pill(chips, 0, 0, '1  Aufbau von Auge und Netzhaut', { size: 26 });
  const c2 = pill(chips, 0, 0, '2  Signaltransduktion', { size: 26 });
  const total = c1.w + c2.w + 30;
  c1.setAttribute('transform', `translate(${960 - total / 2 + c1.w / 2},840)`);
  c2.setAttribute('transform', `translate(${960 - total / 2 + c1.w + 30 + c2.w / 2},840)`);
  show(c1, 'intro:2+0.4');
  show(c2, 'intro:2+3.4');
}

function buildEye() {
  const cx = 960, cy = 600;
  const eye = show(G(stage), 'eye:start', 'retina:start');
  const h1 = show(G(stage), 'eye:start', 'path:start');
  header(h1, 'TEIL 1 · AUFBAU', 'Das Auge im Querschnitt');
  const h2 = show(G(stage), 'path:start', 'spots:start');
  header(h2, 'TEIL 1 · AUFBAU', 'Der Strahlengang');
  const h3 = show(G(stage), 'spots:start', 'retina:start');
  header(h3, 'TEIL 1 · AUFBAU', 'Gelber Fleck und blinder Fleck');

  // Grundform
  E('circle', { cx, cy, r: 290, fill: '#EEF3F7' }, eye);
  E('path', { d: arcPath(cx, cy, 297, -155, 155), fill: 'none', stroke: C.sclera, 'stroke-width': 8 }, eye);
  E('path', { d: 'M690.8,474.5 Q586,600 690.8,725.5 Z', fill: '#E3F1FA' }, eye);
  const cornea = E('path', { d: 'M690.8,474.5 Q586,600 690.8,725.5', fill: 'none', stroke: '#8EC5E8', 'stroke-width': 8, 'stroke-linecap': 'round' }, eye);
  const choroid = E('path', { d: arcPath(cx, cy, 289, -132, 132), fill: 'none', stroke: C.choroid, 'stroke-width': 7 }, eye);
  const retina = E('path', { d: arcPath(cx, cy, 281, -130, 130), fill: 'none', stroke: C.retina, 'stroke-width': 9 }, eye);
  const iris = G(eye);
  E('rect', { x: 694, y: 470, width: 12, height: 92, rx: 6, fill: '#6E9A7A' }, iris);
  E('rect', { x: 694, y: 638, width: 12, height: 92, rx: 6, fill: '#6E9A7A' }, iris);
  E('line', { x1: 742, y1: 527, x2: 712, y2: 468, stroke: '#C9C2B5', 'stroke-width': 2 }, eye);
  E('line', { x1: 742, y1: 673, x2: 712, y2: 732, stroke: '#C9C2B5', 'stroke-width': 2 }, eye);
  const lens = E('ellipse', { cx: 742, cy: 600, rx: 30, ry: 74, fill: '#D3E8F7', stroke: '#86B6DA', 'stroke-width': 3 }, eye);
  const nerve = E('path', { d: 'M1231,662 L1440,662 Q1452,662 1452,674 L1452,706 Q1452,718 1440,718 L1212,718 A278,278 0 0 0 1231,662 Z', fill: C.nerve, stroke: '#CDAA6B', 'stroke-width': 3 }, eye);
  E('path', { d: 'M1240,676 L1440,676 M1236,690 L1440,690 M1230,704 L1440,704', stroke: '#E2C489', 'stroke-width': 2, fill: 'none' }, eye);
  const fovea = E('circle', { cx: 1240, cy: 600, r: 11, fill: '#F4C430', stroke: '#D9A400', 'stroke-width': 2 }, eye);
  const glas = E('text', { x: 965, y: 470, 'text-anchor': 'middle', 'font-size': 26, 'font-style': 'italic', class: 'muted' }, eye, 'Glaskörper');

  // Hervorhebungen (kurzes Aufleuchten beim Nennen)
  const flash = (el, c) => {
    const h = el.cloneNode(true);
    h.setAttribute('filter', 'url(#glow)');
    eye.appendChild(h);
    anims.push({ el: h, tin: cue(c), tout: cue(c) + 2.6, din: 0.4, dout: 0.8, rise: 0, draw: 0, max: 0.9 });
  };
  flash(cornea, 'eye:0+3.6');
  flash(lens, 'eye:1+3.2');
  flash(retina, 'eye:3+0.3');
  flash(choroid, 'eye:4+0.2');
  flash(nerve, 'eye:4+2.6');
  show(glas, 'eye:2');

  // Beschriftungen
  const L = G(stage);
  show(L, 'eye:start', 'path:start');
  show(label(L, 'Hornhaut', 560, 420, 648, 520, 'end'), 'eye:0+3.6');
  show(label(L, 'Iris', 560, 500, 700, 505, 'end'), 'eye:1+0.6');
  show(label(L, 'Pupille', 560, 600, 700, 600, 'end'), 'eye:1+1.8');
  show(label(L, 'Linse', 560, 740, 742, 655, 'end'), 'eye:1+3.2');
  const R = G(stage);
  show(R, 'eye:start', 'retina:start');
  show(label(R, 'Netzhaut (Retina)', 1490, 380, 1141, 385), 'eye:3+0.3');
  show(label(R, 'Aderhaut', 1490, 450, 1188, 422), 'eye:4+0.2');
  show(label(R, 'Sehnerv', 1490, 698, 1452, 690), 'eye:4+2.6');

  // Strahlengang: Lichtstrahlen
  const rays = G(eye);
  show(rays, 'path:start', 'spots:start');
  const rayEls = [548, 600, 652].map(y0 => {
    const d = y0 === 600 ? 'M470,600 L1238,600'
      : `M470,${y0} L646,${y0} L712,${600 + (y0 - 600) * 0.86} L772,${600 + (y0 - 600) * 0.66} L1238,600`;
    return E('path', { d, fill: 'none', stroke: C.light, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#glow)' }, rays);
  });
  const lens0 = rayEls.map(r => r.getTotalLength());
  rayEls.forEach((r, i) => { r.setAttribute('stroke-dasharray', lens0[i]); });
  updaters.push(t => {
    const p = kf(t, [['path:1', 0], ['path:1+1.6', 0.33], ['path:1+3.2', 0.40], ['path:2', 0.40], ['path:2+2.4', 0.76], ['path:3', 0.76], ['path:3+1.4', 1]]);
    rayEls.forEach((r, i) => r.setAttribute('stroke-dashoffset', lens0[i] * (1 - p)));
  });
  show(E('text', { x: 470, y: 526, class: 'lbl', fill: '#B98200' }, rays, 'Licht'), 'path:1');

  // Flussdiagramm links
  const flow = show(G(stage), 'path:start', 'spots:start');
  const steps = [
    ['Licht', 'path:0+1.2', '#FFF4D6', '#F2C14E'],
    ['Hornhaut', 'path:1+1.0', C.card, C.line],
    ['Pupille', 'path:1+2.8', C.card, C.line],
    ['Linse', 'path:2+0.3', C.card, C.line],
    ['Glaskörper', 'path:2+2.4', C.card, C.line],
    ['Netzhaut', 'path:3+0.8', '#FDE7DC', C.retina],
  ];
  steps.forEach(([s, c, fill, stroke], i) => {
    const y = 262 + i * 106;
    const g = G(flow);
    E('rect', { x: 120, y, width: 300, height: 64, rx: 14, fill, stroke, 'stroke-width': 2.5 }, g);
    E('text', { x: 270, y: y + 41, 'text-anchor': 'middle', 'font-size': 27, 'font-weight': 600 }, g, s);
    if (i > 0) E('line', { x1: 270, y1: y - 40, x2: 270, y2: y - 6, stroke: '#9AA3AF', 'stroke-width': 3, 'marker-end': 'url(#arr)' }, g);
    show(g, c);
  });
  show(pill(flow, 270, 870, '→ Fotorezeptoren', { size: 22, h: 46, fill: '#FDE7DC', stroke: C.retina }), 'path:3+3.2');

  // Fovea + blinder Fleck
  const spots = show(G(stage), 'spots:start', 'retina:start');
  const ringF = E('circle', { cx: 1240, cy: 600, r: 22, fill: 'none', stroke: '#E0A800', 'stroke-width': 4 }, spots);
  const ringB = E('circle', { cx: 1222, cy: 690, r: 26, fill: 'none', stroke: C.accent, 'stroke-width': 4 }, spots);
  show(ringF, 'spots:1');
  show(ringB, 'spots:2');
  updaters.push(t => {
    const s = 1 + 0.15 * Math.sin(t * 4);
    ringF.setAttribute('r', 22 * s);
    ringB.setAttribute('r', 26 * s);
  });
  show(label(spots, 'Gelber Fleck', 1490, 572, 1262, 600), 'spots:1');
  show(label(spots, 'Blinder Fleck', 1300, 850, 1222, 716, 'middle'), 'spots:2');

  const card = (y, title, l1, l2, dot, c) => {
    const g = G(spots);
    E('rect', { x: 120, y, width: 440, height: 150, rx: 18, fill: C.card, stroke: C.line, 'stroke-width': 2 }, g);
    E('circle', { cx: 152, cy: y + 42, r: 10, fill: dot }, g);
    E('text', { x: 174, y: y + 51, 'font-size': 27, 'font-weight': 700 }, g, title);
    E('text', { x: 148, y: y + 96, 'font-size': 23, fill: C.grey }, g, l1);
    E('text', { x: 148, y: y + 128, 'font-size': 23, fill: C.grey }, g, l2);
    show(g, c, null, { rise: 10 });
  };
  card(270, 'Gelber Fleck (Fovea)', 'sehr viele Zapfen', '→ schärfstes Sehen', '#F4C430', 'spots:1+0.4');
  card(450, 'Blinder Fleck', 'Austritt des Sehnervs', '→ keine Fotorezeptoren', C.accent, 'spots:2+0.4');
  card(630, 'Keine Lücke im Bild', 'Gehirn ergänzt mit den', 'Infos des anderen Auges', '#9AA3AF', 'spots:3+0.4');
}

function buildRetina() {
  const g = show(G(stage), 'retina:start', 'receptors:start');
  header(g, 'TEIL 1 · AUFBAU', 'Aufbau der Netzhaut');
  const rows = [360, 448, 536, 624, 712, 800];
  const types = ['S', 'Z', 'S', 'S', 'Z', 'S'];
  const mids = [404, 580, 756];

  const base = show(G(g), 'retina:0+0.4', null, { din: 1.2 });
  // Aderhaut + Pigmentzellen
  E('rect', { x: 1455, y: 316, width: 58, height: 528, rx: 10, fill: '#EBC0B3' }, base);
  [340, 420, 500, 580, 660, 740, 820].forEach((y, i) => E('circle', { cx: 1484, cy: y, r: 9, fill: '#C9555A', opacity: 0.8 }, base));
  rows.forEach(y => E('rect', { x: 1393, y: y - 41, width: 60, height: 82, rx: 8, fill: '#8C6A5A', stroke: '#6E5244', 'stroke-width': 2 }, base));
  // Fotorezeptoren
  rows.forEach((y, i) => {
    const r = G(base);
    E('line', { x1: 990, y1: y, x2: 1036, y2: y, stroke: '#9AA8C2', 'stroke-width': 3 }, r);
    E('circle', { cx: 990, cy: y, r: 8, fill: '#E3E8F2', stroke: '#9AA8C2', 'stroke-width': 2 }, r);
    E('ellipse', { cx: 1064, cy: y, rx: 30, ry: 20, fill: '#EEF1F7', stroke: '#9AA8C2', 'stroke-width': 2 }, r);
    E('circle', { cx: 1064, cy: y, r: 11, fill: '#D9677A' }, r);
    E('line', { x1: 1094, y1: y, x2: 1110, y2: y, stroke: '#9AA8C2', 'stroke-width': 3 }, r);
    E('rect', { x: 1110, y: y - 13, width: 100, height: 26, rx: 13, fill: '#E3E8F2', stroke: '#9AA8C2', 'stroke-width': 2 }, r);
    E('line', { x1: 1210, y1: y, x2: 1226, y2: y, stroke: '#9AA8C2', 'stroke-width': 3 }, r);
    if (types[i] === 'S') {
      E('rect', { x: 1226, y: y - 13, width: 186, height: 26, rx: 6, fill: '#C9D3E6', stroke: '#8494B4', 'stroke-width': 2 }, r);
      for (let x = 1234; x < 1408; x += 8) E('line', { x1: x, y1: y - 11, x2: x, y2: y + 11, stroke: '#8494B4', 'stroke-width': 1.5, opacity: 0.6 }, r);
    } else {
      E('path', { d: `M1226,${y - 16} L1336,${y - 5} L1336,${y + 5} L1226,${y + 16} Z`, fill: '#A8C8EE', stroke: '#6E98CC', 'stroke-width': 2, 'stroke-linejoin': 'round' }, r);
      for (let x = 1234; x < 1332; x += 8) {
        const h = lerp(14, 4, (x - 1226) / 110);
        E('line', { x1: x, y1: y - h, x2: x, y2: y + h, stroke: '#6E98CC', 'stroke-width': 1.5, opacity: 0.6 }, r);
      }
    }
  });
  E('text', { x: 1320, y: rows[0] - 22, 'text-anchor': 'middle', 'font-size': 18, fill: C.grey }, base, 'Stäbchen');
  E('text', { x: 1282, y: rows[1] - 24, 'text-anchor': 'middle', 'font-size': 18, fill: C.grey }, base, 'Zapfen');
  // Bipolarzellen
  mids.forEach((ym, j) => {
    const b = G(base);
    const yA = rows[2 * j], yB = rows[2 * j + 1];
    E('path', { d: `M854,${ym} C920,${ym} 930,${yA} 982,${yA} M854,${ym} C920,${ym} 930,${yB} 982,${yB}`, fill: 'none', stroke: '#C97C77', 'stroke-width': 3 }, b);
    E('line', { x1: 806, y1: ym, x2: 618, y2: ym, stroke: '#C97C77', 'stroke-width': 3 }, b);
    E('ellipse', { cx: 830, cy: ym, rx: 26, ry: 18, fill: '#F6CFCB', stroke: '#C97C77', 'stroke-width': 2 }, b);
    E('circle', { cx: 830, cy: ym, r: 8, fill: '#D9677A' }, b);
  });
  // Ganglienzellen + Sehnerv
  E('line', { x1: 430, y1: 330, x2: 430, y2: 850, stroke: '#E9C98E', 'stroke-width': 12, 'stroke-linecap': 'round' }, base);
  mids.forEach(ym => {
    const b = G(base);
    E('line', { x1: 564, y1: ym, x2: 436, y2: ym, stroke: '#D9A35E', 'stroke-width': 3 }, b);
    E('path', { d: `M612,${ym} l18,-16 M612,${ym} l18,16`, stroke: '#D9A35E', 'stroke-width': 3, fill: 'none' }, b);
    E('circle', { cx: 590, cy: ym, r: 26, fill: '#F8DDB0', stroke: '#D9A35E', 'stroke-width': 2 }, b);
    E('circle', { cx: 590, cy: ym, r: 9, fill: '#D9677A' }, b);
  });

  // Licht von links

  show(pill(root, 450, 900, 'Hemmung fällt weg', { size: 24, h: 50, fill: '#E1F3E4', stroke: '#9FD1A8', color: '#2C7A3B' }), 'light:5+3.0');
  // Signal geht weiter
  const sigArrow = E('path', { d: 'M730,912 L730,948', stroke: C.accent, 'stroke-width': 6, 'marker-end': 'url(#arrB)', fill: 'none' }, root);
  show(sigArrow, 'light:6+0.5');

  // Graph: Membranspannung
  const gx = 1240, gy = 250, gw = 520, gh = 230, yHi = 300, yLo = 440;
  const graph = show(G(root), 'dark:2');
  E('rect', { x: gx, y: gy, width: gw, height: gh, rx: 4, fill: '#FFFFFF' }, graph);
  E('path', { d: `M${gx},${gy - 10} L${gx},${gy + gh} L${gx + gw + 10},${gy + gh}`, stroke: '#9AA3AF', 'stroke-width': 2.5, fill: 'none', 'marker-end': 'url(#arr)', 'marker-start': 'url(#arr)' }, graph);
  E('line', { x1: gx, y1: yHi, x2: gx + gw, y2: yHi, stroke: '#ECE7DD', 'stroke-width': 2, 'stroke-dasharray': '6 6' }, graph);
  E('line', { x1: gx, y1: yLo, x2: gx + gw, y2: yLo, stroke: '#ECE7DD', 'stroke-width': 2, 'stroke-dasharray': '6 6' }, graph);
  E('text', { x: gx - 12, y: yHi + 7, 'text-anchor': 'end', 'font-size': 20, fill: C.grey }, graph, '−30');
  E('text', { x: gx - 12, y: yLo + 7, 'text-anchor': 'end', 'font-size': 20, fill: C.grey }, graph, '−70');
  E('text', { x: gx, y: gy - 22, 'font-size': 20, fill: C.grey }, graph, 'Membranspannung (mV)');
  E('text', { x: gx + gw, y: gy + gh + 34, 'text-anchor': 'end', 'font-size': 20, fill: C.grey }, graph, 'Zeit');
  const plot = E('polyline', { fill: 'none', stroke: C.ink, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, graph);
  const lightMark = G(graph);
  const lmLine = E('line', { y1: gy + 8, y2: gy + gh, stroke: C.light, 'stroke-width': 3, 'stroke-dasharray': '6 6' }, lightMark);
  const lmText = E('text', { y: gy + gh - 12, 'font-size': 18, 'font-weight': 700, fill: '#B98200' }, lightMark, 'Licht');
  const readBg = E('rect', { x: gx + gw - 150, y: gy - 60, width: 150, height: 46, rx: 23 }, graph);
  const readTx = E('text', { x: gx + gw - 75, y: gy - 27, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 800 }, graph, '−30 mV');
  const DROP = 0.52, LIGHTX = 0.42;
  const volt = x => (x < DROP ? -30 : -30 - 40 * ease(clamp((x - DROP) / 0.08)));

  // Schrittliste rechts
  const list = (items, prefix) => items.forEach(([s, c, col], i) => {
    const y = 572 + i * 52;
    const it = G(root);
    E('circle', { cx: gx + 10, cy: y - 8, r: 8, fill: col }, it);
    E('text', { x: gx + 32, y, 'font-size': 24, 'font-weight': 500 }, it, s);
    show(it, c, prefix === 'd' ? 'light:start' : null, { rise: 8 });
  });
  list([
    ['Rhodopsin (Rh) ist inaktiv', 'dark:0+2.0', C.rh],
    ['cGMP hält Na⁺-Kanäle offen', 'dark:1+1.8', C.cgmp],
    ['Na⁺-Einstrom → −30 mV', 'dark:2+2.0', C.na],
    ['ständige Glutamat-Ausschüttung', 'dark:3+1.2', '#1E3A6B'],
    ['→ Hemmung der Bipolarzelle', 'dark:4+0.4', '#B42B2B'],
  ], 'd');
  list([
    ['Photon aktiviert Rhodopsin → Rh*', 'light:0+2.6', C.light],
    ['Rh* aktiviert Transducin → T*', 'light:1+0.8', C.rh],
    ['T* aktiviert Enzym → cGMP gespalten', 'light:2+1.0', '#7FB77E'],
    ['Na⁺-Kanäle schließen sich', 'light:3+0.6', C.na],
    ['Hyperpolarisation → −70 mV', 'light:4+0.6', C.accent],
    ['kein Glutamat → Hemmung fällt weg', 'light:5+1.0', '#2C7A3B'],
    ['Signal → Bipolar- → Ganglienzelle', 'light:6+0.6', C.accent],
  ], 'l');

  // Zustände über die Zeit
  updaters.push(t => {
    const vis = (el, a) => { el.style.opacity = a; el.style.display = a <= 0.001 ? 'none' : ''; };
    const inDark = ramp(t, cue('dark:0+0.4'), 0.6);
    vis(rh, inDark); vis(T, inDark * (1 - ramp(t, cue('light:1+0.6'), 0.6))); vis(TL, inDark * (1 - ramp(t, cue('light:1+0.6'), 0.6)));
    const act = ramp(t, cue('light:0+1.6'), 0.6);
    vis(rhL, inDark * (1 - act)); vis(rhL2, act);
    vis(rhGlow, act * (0.6 + 0.4 * Math.sin(t * 5)));
    // Photon
    const ph = ramp(t, cue('light:0+0.4'), 1.2);
    photon.setAttribute('stroke-dashoffset', phLen * (1 - ph));
    vis(photon, ph > 0 ? 1 - ramp(t, cue('light:2'), 1) : 0);
    vis(phL, ph > 0.3 ? 1 - ramp(t, cue('light:2'), 1) : 0);
    vis(tstar, ramp(t, cue('light:1+0.6'), 0.8));
    vis(enz, ramp(t, cue('light:2+0.6'), 0.8));
    // cGMP
    const cgIn = ramp(t, cue('dark:1+0.8'), 0.8);
    const split = ramp(t, cue('light:2+2.4'), 1.6);
    cg.forEach(({ g, a, b }) => {
      vis(g, cgIn * (1 - split * 0.9));
      a.setAttribute('transform', `translate(${-7 * split},${4 * split})`);
      b.setAttribute('transform', `translate(${7 * split},${-4 * split})`);
    });
    vis(cgL, cgIn * (1 - ramp(t, cue('light:3'), 0.6)));
    // Kanäle
    const close = ramp(t, cue('light:3+0.4'), 1.2);
    chans.forEach(c => {
      c.top.setAttribute('transform', `translate(0,${6 * close})`);
      c.bot.setAttribute('transform', `translate(0,${-6 * close})`);
      vis(c.bound, cgIn * (1 - ramp(t, cue('light:3'), 0.8)));
    });
    // Na+
    const naIn = ramp(t, cue('dark:1+3.4'), 0.8);
    naS.forEach(e => vis(e, naIn));
    const flow = ramp(t, cue('dark:2'), 0.8) * (1 - close);
    naFlow.forEach(n => {
      const p = (t * 0.45 + n.ph) % 1;
      const x = lerp(560, 720, p);
      n.el.setAttribute('cx', x);
      n.el.setAttribute('cy', n.y + Math.sin(p * 9 + n.ph * 6) * (p < 0.3 ? 4 : 14));
      vis(n.el, flow * Math.min(1, p * 5, (1 - p) * 5));
    });
    // Glutamat
    const rel = ramp(t, cue('dark:3+0.6'), 0.8) * (1 - ramp(t, cue('light:5+0.4'), 1.4));
    glu.forEach(g => {
      const p = (t * 0.6 + g.ph) % 1;
      g.el.setAttribute('cx', g.x + Math.sin(p * 6 + g.ph * 9) * 3);
      g.el.setAttribute('cy', 816 + p * 26);
      vis(g.el, rel * Math.min(1, p * 6, (1 - p) * 4));
    });
    // Graph
    const p = kf(t, [['dark:2', 0], ['light:0', 0.40], ['light:4+0.6', DROP], ['light:end', 1]]);
    const pts = [];
    for (let i = 0; i <= 120; i++) {
      const x = (i / 120) * p;
      pts.push(`${gx + x * gw},${lerp(yHi, yLo, (-30 - volt(x)) / 40)}`);
    }
    plot.setAttribute('points', pts.join(' '));
    const lx = gx + LIGHTX * gw;
    lmLine.setAttribute('x1', lx); lmLine.setAttribute('x2', lx); lmText.setAttribute('x', lx + 8);
    vis(lightMark, p >= LIGHTX ? 1 : 0);
    const v = volt(p);
    const k = (-30 - v) / 40;
    readTx.textContent = `−${Math.round(-v)} mV`;
    readBg.setAttribute('fill', k < 0.5 ? '#FDE3DD' : '#DDE7FB');
  });
}

function buildSummary() {
  const g = show(G(stage), 'summary:start', 'outro:start');
  header(g, 'TEIL 2 · SIGNALTRANSDUKTION', 'Zusammenfassung: die Kaskade bei Licht');
  const row = (items, y, c0, step) => {
    const ws = items.map(([s]) => textWidth(s, 30, 700) + 56);
    const gap = 70, total = ws.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
    let x = 960 - total / 2;
    const boxes = [];
    items.forEach(([s, sub, fill, stroke, color], i) => {
      const it = G(g);
      E('rect', { x, y, width: ws[i], height: 84, rx: 18, fill, stroke, 'stroke-width': 2.5 }, it);
      E('text', { x: x + ws[i] / 2, y: y + 53, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 700, fill: color || C.ink }, it, s);
      E('text', { x: x + ws[i] / 2, y: y + 118, 'text-anchor': 'middle', 'font-size': 20, fill: C.grey }, it, sub);
      if (i > 0) E('line', { x1: x - gap + 10, y1: y + 42, x2: x - 12, y2: y + 42, stroke: '#9AA3AF', 'stroke-width': 3, 'marker-end': 'url(#arr)' }, it);
      show(it, `${c0}+${(i * step).toFixed(2)}`, null, { rise: 8 });
      boxes.push([x, ws[i]]);
      x += ws[i] + gap;
    });
    return boxes;
  };
  const r1 = row([
    ['Licht', 'Photon', '#FFF4D6', '#F2C14E', '#8A6200'],
    ['Rh*', 'Rhodopsin aktiv', '#FBE9EC', '#EBB4BE', C.rh],
    ['T*', 'Transducin aktiv', '#FBE9EC', '#EBB4BE', C.rh],
    ['Enzym', 'spaltet cGMP', '#E6F2E6', '#A9D3A9', '#2C7A3B'],
    ['cGMP ↓', 'sek. Botenstoff', '#FBE9EC', '#EBB4BE', C.cgmp],
  ], 280, 'summary:1', 1.4);
  const r2 = row([
    ['Na⁺-Kanäle zu', 'kein Na⁺-Einstrom', '#FFF6DB', '#EED17A'],
    ['−70 mV', 'Hyperpolarisation', '#EAF1FD', '#C5D7F7', C.accent],
    ['Glutamat ↓', 'an der Synapse', '#E8ECF4', '#B8C3D9', '#1E3A6B'],
    ['Hemmung fällt weg', 'Bipolarzelle', '#E1F3E4', '#9FD1A8', '#2C7A3B'],
  ], 520, 'summary:2', 2.0);
  // Verbindung Reihe 1 -> Reihe 2
  const [lx, lw] = r1[r1.length - 1], [fx, fw] = r2[0];
  const conn = E('path', { d: `M${lx + lw / 2},${280 + 130} L${lx + lw / 2},${470} L${fx + fw / 2},${470} L${fx + fw / 2},${514}`, fill: 'none', stroke: '#9AA3AF', 'stroke-width': 3, 'marker-end': 'url(#arr)' }, g);
  show(conn, 'summary:2');
}

function buildOutro() {
  const g = show(G(stage), 'outro:start');
  show(E('text', { x: 960, y: 470, 'text-anchor': 'middle', 'font-size': 84, 'font-weight': 800 }, g, 'Danke fürs Zuschauen!'), 'outro:1-0.2', null, { rise: 12 });
  show(E('text', { x: 960, y: 380, 'text-anchor': 'middle', class: 'tag' }, g, 'SINNESORGAN AUGE'), 'outro:start+0.3');
  const q = show(G(g), 'outro:start+0.8');
  E('text', { x: 960, y: 760, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.grey }, q, 'Quellen');
  E('text', { x: 960, y: 798, 'text-anchor': 'middle', 'font-size': 22, fill: C.grey }, q, 'Biologie heute – Erweiterte Ausgabe SII (2011) · Biosphäre Neurobiologie SII (2016)');
  E('text', { x: 960, y: 832, 'text-anchor': 'middle', 'font-size': 22, fill: C.grey }, q, 'Unterrichtsmaterial M1 „Zellulärer Aufbau der Retina“, M2 „Aufbau der Fotorezeptoren“');
}

// Fortschrittsbalken
let progress;
function buildProgress() {
  E('rect', { x: 0, y: 1074, width: 1920, height: 6, fill: '#ECE7DD' });
  progress = E('rect', { x: 0, y: 1074, width: 0, height: 6, fill: C.accent, opacity: 0.55 });
}

// ---------- Render ----------
window.renderAt = function (t) {
  for (const a of anims) {
    let alpha = ease(clamp((t - a.tin) / a.din));
    if (a.tout != null) alpha *= 1 - ease(clamp((t - (a.tout - a.dout)) / a.dout));
    alpha *= a.max;
    if (a.draw) {
      const p = ease(clamp((t - a.tin) / a.draw));
      a.el.setAttribute('stroke-dashoffset', a.len * (1 - p));
    }
    a.el.style.display = alpha <= 0.001 ? 'none' : '';
    a.el.style.opacity = alpha;
    if (a.rise) a.el.setAttribute('transform', `translate(0,${(1 - ease(clamp((t - a.tin) / a.din))) * a.rise})`);
  }
  for (const u of updaters) u(t);
  progress.setAttribute('width', 1920 * clamp(t / TIMING.total));
};
window.TOTAL = TIMING.total;

document.fonts.ready.then(() => {
  buildProgress();
  buildIntro();
  buildEye();
  buildRetina();
  buildReceptors();
  buildCompare();
  buildSTIntro();
  buildRod();
  buildSummary();
  buildOutro();
  const q = new URLSearchParams(location.search);
  window.renderAt(q.has('t') ? parseFloat(q.get('t')) : 0);
  window.READY = true;
});
</script>
